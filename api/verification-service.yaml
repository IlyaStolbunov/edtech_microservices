openapi: 3.0.3
info:
  title: Verification Service API
  version: 1.0.0
servers:
  - url: http://api-gateway/api

paths:
  /v1/verification/start:
    post:
      tags: [public]
      summary: Начать тест на верификацию навыков
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
      responses:
        '201':
          description: Тест сгенерирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  testId: { type: string, format: uuid }
                  questions: 
                    type: array
                    items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/verification/submit:
    post:
      tags: [public]
      summary: Отправить ответы на проверку
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                testId: { type: string, format: uuid }
                answers:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  score: { type: integer }
                  passed: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }

  /internal/v1/badges/{tutorId}:
    get:
      tags: [internal]
      summary: Получить бейджи верификации репетитора (для matching)
      parameters:
        - in: path
          name: tutorId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Список бейджей
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri, example: "https://api.example.com/errors/validation" }
        title: { type: string, example: "Bad Request" }
        status: { type: integer, example: 400 }
        detail: { type: string, example: "Ошибка валидации данных" }
  
  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Не найдено
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }